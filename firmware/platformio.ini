[platformio]
default_envs = atmega2560

[env:atmega2560]
platform = atmelavr
board = megaatmega2560
framework = arduino
upload_speed = 115200
monitor_speed = 9600
build_flags = 
    -D SERIAL_BAUD=9600
    -D MCU_ATMEGA2560

; Future STM32 configuration ready for plug-and-play switching
[env:stm32_f401]
platform = ststm32
board = nucleo_f401re
framework = arduino
monitor_speed = 9600
build_flags =
    -D SERIAL_BAUD=9600
    -D MCU_STM32
